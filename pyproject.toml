[build-system]
requires = ["setuptools>=75.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "agentic-note-taker"
version = "3.0.0"
description = "🤖 Agentic RAG-powered note-taking system with intelligent agents"
authors = [{name = "FailedToAchieveOrbit", email = "contact@example.com"}]
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.12"
keywords = ["agentic", "RAG", "notes", "AI", "agents", "semantic-search", "LLM"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Office/Business :: Groupware",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
]

dependencies = [
    # Core framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.32.0",
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    
    # Agentic frameworks
    "langgraph>=0.2.45",
    "langchain>=0.3.7",
    "langchain-openai>=0.2.8",
    "langchain-community>=0.3.5",
    "crewai>=0.84.0",
    
    # Vector database and search
    "qdrant-client>=1.12.1",
    "chromadb>=0.5.23",
    "sentence-transformers>=3.3.1",
    "rank-bm25>=0.2.2",
    
    # AI and embeddings
    "openai>=1.54.4",
    "instructor>=1.6.5",
    "litellm>=1.52.16",
    
    # Async and performance
    "asyncio-mqtt>=0.16.2",
    "aiofiles>=24.1.0",
    "httpx>=0.28.0",
    "tenacity>=9.0.0",
    
    # Data processing
    "numpy>=2.1.3",
    "pandas>=2.2.3",
    "scikit-learn>=1.5.2",
    
    # CLI and UI
    "typer[rich]>=0.15.1",
    "rich>=13.9.4",
    "textual>=0.85.2",
    
    # Monitoring and observability
    "langfuse>=2.53.3",
    "prometheus-client>=0.21.0",
    "structlog>=24.4.0",
]

[project.optional-dependencies]
development = [
    "ruff>=0.8.4",
    "mypy>=1.13.0",
    "pytest>=8.3.3",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "pre-commit>=4.0.1",
    "black>=24.10.0",
    "isort>=5.13.2",
]
testing = [
    "pytest-benchmark>=4.0.0",
    "pytest-mock>=3.14.0",
    "pytest-xdist>=3.6.0",
    "coverage>=7.6.7",
    "factory-boy>=3.3.1",
]
production = [
    "gunicorn>=23.0.0",
    "redis>=5.2.0",
    "celery>=5.4.0",
    "sentry-sdk[fastapi]>=2.18.0",
]

[project.scripts]
agentic-notes = "agentic_notes.cli:main"
agentic-server = "agentic_notes.server:run_server"
agentic-agents = "agentic_notes.agents.crew:run_crew"

[project.urls]
Homepage = "https://github.com/FailedToAchieveOrbit/robust-note-taker"
Repository = "https://github.com/FailedToAchieveOrbit/robust-note-taker"
Issues = "https://github.com/FailedToAchieveOrbit/robust-note-taker/issues"
Documentation = "https://agentic-notes.readthedocs.io"

[tool.setuptools.packages.find]
where = ["src"]
include = ["agentic_notes*"]

[tool.setuptools.package-data]
agentic_notes = ["py.typed", "*.yaml", "*.json"]

# Development tools configuration
[tool.ruff]
target-version = "py312"
line-length = 88
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "UP",          # pyupgrade
    "ARG",         # flake8-unused-arguments
    "SIM",         # flake8-simplify
    "TRY",         # tryceratops
    "RUF",         # ruff-specific
    "ASYNC",       # flake8-async
    "PL",          # pylint
]
ignore = [
    "E501",        # line too long (handled by black)
    "TRY003",      # long messages in exceptions
    "PLR0913",     # too many arguments
    "PLR2004",     # magic values
]

[tool.ruff.per-file-ignores]
"__init__.py" = ["F401"]
"tests/**/*.py" = ["S101", "ARG", "FBT", "PLR2004"]

[tool.mypy]
python_version = "3.12"
strict = true
warn_return_any = true
warn_unused_configs = true
show_error_codes = true
ignore_missing_imports = false
allow_redefinition = true

[tool.pytest.ini_options]
minversion = "8.0"
addopts = "-ra -q --strict-markers --strict-config --cov=agentic_notes"
testpaths = ["tests"]
python_files = ["test_*.py", "*_test.py"]
markers = [
    "slow: marks tests as slow",
    "integration: marks integration tests",
    "unit: marks unit tests",
    "agent: marks agent-specific tests",
]
asyncio_mode = "auto"

[tool.coverage.run]
source = ["src/agentic_notes"]
omit = ["tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise AssertionError",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "@abstractmethod",
]
show_missing = true
min_coverage = 85

[tool.black]
target-version = ['py312']
line-length = 88
include = '\.pyi?$'
extend-exclude = '''
/(
  __pycache__
  | \.git
  | \.mypy_cache
  | \.pytest_cache
  | \.ruff_cache
  | build
  | dist
)/
'''

[tool.isort]
profile = "black"
line_length = 88
multi_line_output = 3
include_trailing_comma = true
force_grid_wrap = 0
use_parentheses = true
ensure_newline_before_comments = true